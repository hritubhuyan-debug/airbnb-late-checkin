<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>I'm in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#222222}a:hover{color:#000000}</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif; color: #222222; background: #FFFFFF; display: flex; flex-direction: column">
  <div style="flex: 1; padding: 56px 24px 24px 24px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; gap: 4px" aria-hidden="true"><div style="flex: 1; height: 4px; border-radius: 2px; background: #222222"></div><div style="flex: 1; height: 4px; border-radius: 2px; background: #222222"></div><div style="flex: 1; height: 4px; border-radius: 2px; background: #222222"></div><div style="flex: 1; height: 4px; border-radius: 2px; background: #067A3A"></div></div>
    <div style="width: 72px; height: 72px; border-radius: 36px; background: #E8F5EC; display: flex; align-items: center; justify-content: center; margin-top: 40px"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#067A3A" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></div>
    <h1 style="margin: 0; font-size: 30px; font-weight: 700">You're in. Rest up.</h1>
    <div style="border-radius: 12px; border: 1px solid #DDDDDD; padding: 16px; display: flex; justify-content: space-between">
      <span style="font-size: 15px">Priya</span>
      <sc-if value="{{ pending }}" hint-placeholder-val="{{ true }}"><span style="font-size: 14px; font-weight: 600; color: #8A4B00">Confirming check-in…</span></sc-if>
      <sc-if value="{{ done }}" hint-placeholder-val="{{ false }}"><span style="font-size: 14px; font-weight: 600; color: #05592A">Check-in confirmed</span></sc-if>
    </div>
  </div>
  <div style="padding: 16px 24px 32px 24px">
    <a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 8px; border: 1px solid #222222; color: #222222; font-size: 16px; font-weight: 600; text-decoration: none">Restart prototype</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { done: false }; }
  componentDidMount() { this.t = setTimeout(() => this.setState({ done: true }), 3000); }
  componentWillUnmount() { clearTimeout(this.t); }
  renderVals() { return { pending: !this.state.done, done: this.state.done }; }
}
</script>
</body>
</html>
