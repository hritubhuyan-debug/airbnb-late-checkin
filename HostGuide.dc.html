<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Host: set up arrival guide</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#222222}a:hover{color:#000000}button{font-family:inherit}</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif; color: #222222; background: #FFFFFF; display: flex; flex-direction: column">
  <div style="flex: 1; padding: 56px 24px 24px 24px; display: flex; flex-direction: column; gap: 16px">
    <div style="font-size: 14px; color: #6A6A6A; font-weight: 600">One-time setup · 5 min</div>
    <h1 style="margin: 0; font-size: 28px; font-weight: 700; line-height: 1.2">Help guests find your door</h1>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 14px; font-weight: 600">Nearest landmark</span>
      <div style="height: 48px; border-radius: 12px; border: 1px solid #DDDDDD; display: flex; align-items: center; padding: 0 14px; font-size: 15px">Sai Medical, open 24 hrs</div>
    </div>
    <span style="font-size: 14px; font-weight: 600">3 photos: landmark, turn, gate</span>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <div style="height: 84px; border-radius: 10px; background: #E9DED3; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #6A6A6A">Landmark</div>
      <div style="height: 84px; border-radius: 10px; background: #E9DED3; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #6A6A6A">Turn</div>
      <div style="height: 84px; border-radius: 10px; border: 1.5px dashed #B0B0B0; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #222222">+ Gate</div>
    </div>
    <div style="border-radius: 12px; border: 1px solid #DDDDDD; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start">
      <div style="display: flex; flex-direction: column; gap: 4px; flex: 1">
        <div style="display: flex; gap: 8px; align-items: center"><span style="font-size: 15px; font-weight: 600">Gate marker</span><span style="font-size: 12px; font-weight: 600; color: #05592A; background: #E8F5EC; padding: 2px 8px; border-radius: 999px">Recommended</span></div>
        <span style="font-size: 14px; color: #6A6A6A; line-height: 1.4">A lit or reflective house number helps guests at night. Optional.</span>
      </div>
      <div role="switch" aria-checked="false" aria-label="Gate marker" onclick="var on=this.getAttribute('aria-checked')!=='true';this.setAttribute('aria-checked',on);this.style.background=on?'#222222':'#DDDDDD';this.firstChild.style.left=on?'23px':'3px'" style="width: 48px; height: 28px; border-radius: 14px; background: #DDDDDD; position: relative; flex-shrink: 0; cursor: pointer; transition: background .15s"><div style="position: absolute; left: 3px; top: 3px; transition: left .15s; width: 22px; height: 22px; border-radius: 11px; background: #FFFFFF"></div></div>
    </div>
  </div>
  <div style="padding: 16px 24px 32px 24px">
    <button onclick="location.href='HostReady.dc.html'" style="width: 100%; height: 52px; border-radius: 8px; border: none; background: #E00B41; color: #FFFFFF; font-size: 16px; font-weight: 600">Save arrival guide</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
