<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Share arrival time</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#222222}a:hover{color:#000000}button{font-family:inherit;cursor:pointer}</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif; color: #222222; background: #FFFFFF; display: flex; flex-direction: column">
  <div style="padding: 52px 16px 0 16px"><a href="HowItWorks.dc.html" aria-label="Back" style="width: 48px; height: 48px; border-radius: 24px; background: #F2F2F2; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#222222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg></a></div>
  <div style="flex: 1; padding: 12px 24px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; gap: 4px" aria-hidden="true"><div style="flex: 1; height: 4px; border-radius: 2px; background: #222222"></div><div style="flex: 1; height: 4px; border-radius: 2px; background: #DDDDDD"></div><div style="flex: 1; height: 4px; border-radius: 2px; background: #DDDDDD"></div><div style="flex: 1; height: 4px; border-radius: 2px; background: #DDDDDD"></div></div>
    <h1 style="margin: 0; font-size: 26px; font-weight: 700">When will you arrive?</h1>
    <div style="font-size: 13px; font-weight: 700; color: #6A6A6A; text-transform: uppercase; letter-spacing: 0.5px">Evening · Thu 19 Nov</div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{ evening }}" as="o" hint-placeholder-count="2">
        <sc-if value="{{ o.selected }}" hint-placeholder-val="{{ false }}"><button onClick="{{ o.pick }}" aria-pressed="true" style="height: 52px; border-radius: 12px; border: 2px solid #222222; background: #F7F7F7; font-size: 15px; font-weight: 600; color: #222222">{{ o.label }}</button></sc-if>
        <sc-if value="{{ o.unselected }}" hint-placeholder-val="{{ true }}"><button onClick="{{ o.pick }}" aria-pressed="false" style="height: 52px; border-radius: 12px; border: 1px solid #DDDDDD; background: #FFFFFF; font-size: 15px; color: #222222">{{ o.label }}</button></sc-if>
      </sc-for>
    </div>
    <div style="font-size: 13px; font-weight: 700; color: #6A6A6A; text-transform: uppercase; letter-spacing: 0.5px">Late night</div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{ night }}" as="o" hint-placeholder-count="4">
        <sc-if value="{{ o.selected }}" hint-placeholder-val="{{ false }}"><button onClick="{{ o.pick }}" aria-pressed="true" style="height: 52px; border-radius: 12px; border: 2px solid #222222; background: #F7F7F7; font-size: 15px; font-weight: 600; color: #222222">{{ o.label }}</button></sc-if>
        <sc-if value="{{ o.unselected }}" hint-placeholder-val="{{ true }}"><button onClick="{{ o.pick }}" aria-pressed="false" style="height: 52px; border-radius: 12px; border: 1px solid #DDDDDD; background: #FFFFFF; font-size: 15px; color: #222222">{{ o.label }}</button></sc-if>
      </sc-for>
    </div>
    <sc-if value="{{ late }}" hint-placeholder-val="{{ true }}">
      <div style="border-radius: 12px; background: #FFF4E5; padding: 12px 16px; font-size: 14px; color: #5C3300">Late night: your host will add a backup contact.</div>
    </sc-if>
    <div style="font-size: 13px; font-weight: 700; color: #6A6A6A; text-transform: uppercase; letter-spacing: 0.5px">Get entry details by</div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <sc-if value="{{ isCall }}" hint-placeholder-val="{{ false }}"><button onClick="{{ pickCall }}" aria-pressed="true" style="height: 48px; border-radius: 12px; border: 2px solid #222222; background: #F7F7F7; font-size: 15px; font-weight: 600; color: #222222">Call</button></sc-if>
      <sc-if value="{{ notCall }}" hint-placeholder-val="{{ true }}"><button onClick="{{ pickCall }}" aria-pressed="false" style="height: 48px; border-radius: 12px; border: 1px solid #DDDDDD; background: #FFFFFF; font-size: 15px; color: #222222">Call</button></sc-if>
      <sc-if value="{{ isMsg }}" hint-placeholder-val="{{ false }}"><button onClick="{{ pickMsg }}" aria-pressed="true" style="height: 48px; border-radius: 12px; border: 2px solid #222222; background: #F7F7F7; font-size: 15px; font-weight: 600; color: #222222">Message</button></sc-if>
      <sc-if value="{{ notMsg }}" hint-placeholder-val="{{ true }}"><button onClick="{{ pickMsg }}" aria-pressed="false" style="height: 48px; border-radius: 12px; border: 1px solid #DDDDDD; background: #FFFFFF; font-size: 15px; color: #222222">Message</button></sc-if>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; padding-top: 4px">
      <span style="font-size: 15px">ID shared with host</span>
      <span style="font-size: 14px; font-weight: 600; color: #05592A">Verified</span>
    </div>
  </div>
  <div style="padding: 16px 24px 32px 24px">
    <a href="Pending.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 8px; background: #E00B41; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none">Send to Priya</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { pick: 'n2', ch: '' }; }
  renderVals() {
    const cur = this.state.pick;
    const ch = this.state.ch;
    const mk = (list) => list.map((o) => ({ label: o.label, selected: o.id === cur, unselected: o.id !== cur, pick: () => this.setState({ pick: o.id }) }));
    return {
      evening: mk([{ id: 'e1', label: '6 – 8 PM' }, { id: 'e2', label: '8 – 10 PM' }]),
      night: mk([{ id: 'n1', label: '10 PM – 12 AM' }, { id: 'n2', label: '12 – 2 AM' }, { id: 'n3', label: '2 – 4 AM' }, { id: 'n4', label: 'After 4 AM' }]),
      late: cur.charAt(0) === 'n',
      isCall: ch === 'call', notCall: ch !== 'call',
      isMsg: ch === 'msg', notMsg: ch !== 'msg',
      pickCall: () => this.setState({ ch: 'call' }),
      pickMsg: () => this.setState({ ch: 'msg' })
    };
  }
}
</script>
</body>
</html>
