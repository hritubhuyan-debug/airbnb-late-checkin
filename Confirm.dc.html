<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Are you on time</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#222222}a:hover{color:#000000}button{font-family:inherit;cursor:pointer}</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif; color: #222222; background: #FFFFFF; display: flex; flex-direction: column">
  <div style="flex: 1; padding: 56px 24px 24px 24px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; gap: 4px" aria-hidden="true"><div style="flex: 1; height: 4px; border-radius: 2px; background: #222222"></div><div style="flex: 1; height: 4px; border-radius: 2px; background: #222222"></div><div style="flex: 1; height: 4px; border-radius: 2px; background: #F5B971"></div><div style="flex: 1; height: 4px; border-radius: 2px; background: #DDDDDD"></div></div>
    <div style="font-size: 14px; color: #6A6A6A">Casa Azul · your window: 12 – 2 AM</div>
    <h1 style="margin: 0 0 8px 0; font-size: 26px; font-weight: 700">Is your arrival window still right?</h1>
    <sc-for list="{{ options }}" as="o" hint-placeholder-count="3">
      <sc-if value="{{ o.selected }}" hint-placeholder-val="{{ false }}"><button onClick="{{ o.pick }}" aria-pressed="true" style="height: 60px; border-radius: 12px; border: 2px solid #222222; background: #F7F7F7; text-align: left; padding: 0 16px; font-size: 16px; font-weight: 600; color: #222222">{{ o.label }}</button></sc-if>
      <sc-if value="{{ o.unselected }}" hint-placeholder-val="{{ true }}"><button onClick="{{ o.pick }}" aria-pressed="false" style="height: 60px; border-radius: 12px; border: 1px solid #DDDDDD; background: #FFFFFF; text-align: left; padding: 0 16px; font-size: 16px; color: #222222">{{ o.label }}</button></sc-if>
    </sc-for>
    <sc-if value="{{ isLate }}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; gap: 8px">
        <span style="flex: 1; height: 44px; border-radius: 10px; border: 1px solid #DDDDDD; display: flex; align-items: center; justify-content: center; font-size: 14px">2 – 4 AM</span>
        <span style="flex: 1; height: 44px; border-radius: 10px; border: 1px solid #DDDDDD; display: flex; align-items: center; justify-content: center; font-size: 14px">After 4 AM</span>
        <span style="flex: 1; height: 44px; border-radius: 10px; border: 1px solid #DDDDDD; display: flex; align-items: center; justify-content: center; font-size: 14px">Not sure</span>
      </div>
    </sc-if>
    <div style="font-size: 14px; color: #6A6A6A">{{ note }}</div>
  </div>
  <div style="padding: 16px 24px 32px 24px">
    <sc-if value="{{ coming }}" hint-placeholder-val="{{ true }}">
      <a href="OnTheWay.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 8px; background: #E00B41; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none">Notify Priya</a>
    </sc-if>
    <sc-if value="{{ notComing }}" hint-placeholder-val="{{ false }}">
      <a href="NotComing.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 8px; background: #E00B41; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none">Notify Priya</a>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { pick: 'on' }; }
  renderVals() {
    const cur = this.state.pick;
    const list = [
      { id: 'on', label: 'Yes, still 12 – 2 AM' },
      { id: 'late', label: 'Running late, new window' },
      { id: 'no', label: 'Not coming tonight' }
    ];
    const notes = { on: 'Priya will call you with entry details, as you chose.', late: 'Priya and Ravi see your new window.', no: "Priya won't wait up." };
    return {
      options: list.map((o) => ({ label: o.label, selected: o.id === cur, unselected: o.id !== cur, pick: () => this.setState({ pick: o.id }) })),
      isLate: cur === 'late',
      coming: cur !== 'no',
      notComing: cur === 'no',
      note: notes[cur]
    };
  }
}
</script>
</body>
</html>
